apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring # لازم يكون في نفس مكان جرافانا
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: grafana.local # الدومين اللي هتدخل بيه
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-stack-grafana
                port:
                  number: 80
