apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memcached-hpa
  namespace: vprofile
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memcached
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization 
          averageUtilization: 80