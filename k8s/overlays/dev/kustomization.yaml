apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vprofile-dev

resources:
  - ../../base

# الـ Namespace object في الـ base اسمه `vprofile`. السطر `namespace: vprofile-dev`
# فوق هيـ rename الـ Namespace resource نفسه لـ `vprofile-dev` تلقائيًا.

# الـ PersistentVolume cluster-scoped، فلازم نديله اسم ومسار مختلفين
# عن الـ prod عشان الاتنين يقدروا يشتغلوا في نفس الـ cluster من غير تعارض.
patches:
  - target:
      kind: PersistentVolume
      name: mysql-pv
    patch: |-
      - op: replace
        path: /metadata/name
        value: mysql-pv-dev
      - op: replace
        path: /spec/hostPath/path
        value: /mnt/k8s/mysql-dev
  - target:
      kind: PersistentVolumeClaim
      name: mysql-pvc
    patch: |-
      - op: replace
        path: /spec/volumeName
        value: mysql-pv-dev
  - target:
      kind: Ingress
      name: apps-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.el30mda.local
